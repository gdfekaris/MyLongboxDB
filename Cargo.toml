[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/gdfekaris/MyLongboxDB"
publish = false

[workspace.lints.clippy]
# Running other programs is banned; the paths live in clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"

# Arithmetic that overflows stops the app rather than wrapping into a
# wrong size or index, as it does in development builds. Hostile files
# reach code that counts pixels and bytes.
[profile.release]
overflow-checks = true

# Photos are resized and converted in loops that run far too slowly
# unoptimized, which would make tests and debug builds crawl.
[profile.dev.package.mylongbox-media]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.moxcms]
opt-level = 2

# cargo-vet's audit records live with the other build files.
[workspace.metadata.vet]
store = { path = "./build-aux/supply-chain" }
