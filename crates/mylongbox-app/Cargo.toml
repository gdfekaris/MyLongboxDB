[package]
name = "mylongbox-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mylongboxdb"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mylongbox-core = { path = "../mylongbox-core", version = "0.1.2" }
mylongbox-media = { path = "../mylongbox-media", version = "0.1.2", features = ["heic"] }
mylongbox-sandbox = { path = "../mylongbox-sandbox", version = "0.1.2" }
adw = { package = "libadwaita", version = "0.9" }
gtk = { package = "gtk4", version = "0.11", features = ["blueprint", "gnome_49"] }
relm4 = { version = "0.11", default-features = false, features = ["macros", "libadwaita", "gnome_49"] }
