[package]
name = "mylongbox-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# CSV export and import.
csv = "1.4.0"
# Full export archives: deflate only, through the pure-Rust zlib port,
# without the many other formats and the encryption it offers.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Edit distance, for finding what a mistyped search word meant.
strsim = "0.11.1"
rusqlite = { version = "0.40.2", features = ["backup", "bundled", "limits"] }
uuid = { version = "1.28.0", default-features = false, features = ["std", "v4"] }
# Saved shelves keep their filter rules as JSON in the collection.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
